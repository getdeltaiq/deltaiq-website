name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing GitHub secrets NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID."
            echo "Add them under repo Settings → Secrets → Actions, then re-run this workflow."
            echo "Or reconnect Continuous Deployment in Netlify to getdeltaiq/deltaiq-website (publish dir: files)."
            exit 1
          fi

      - name: Deploy files/ to Netlify production
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./files
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
