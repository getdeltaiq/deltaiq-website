# Exec cover-us gates

on:
  pull_request:
  push:
    paths:
      - "exec/**"
      - ".github/workflows/exec-gates.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gate unit tests
        run: python3 -m unittest engine.overlay.tests.test_publish exec.tests.test_gates
