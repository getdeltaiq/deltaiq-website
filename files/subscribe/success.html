<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>DeltaIQ — Subscription started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="chrome-bar">
  <div class="chrome-inner">
    <div class="chrome-dots"><span></span><span></span><span></span></div>
    <div class="brand"><a href="../index.html" style="color:inherit;text-decoration:none;">delta<span>iq</span></a></div>
    <nav class="top-nav">
      <a href="../account.html" class="nav-account">My Account</a>
    </nav>
  </div>
</div>
<div class="wrap">
  <section class="hero" style="border-bottom:none;">
    <p class="eyebrow">// WELCOME</p>
    <h1 class="headline">You&rsquo;re in. Next: create your password.</h1>
    <p class="subhead">Checkout is complete. Use the button below to create your account password on our secure app host. Keep this page&rsquo;s link — it verifies your checkout.</p>
    <div class="cta-row">
      <a class="btn-primary" id="accountCta" href="https://deltaiq-signal-engine-production.up.railway.app/account/login?set_password=1">Create password</a>
      <a class="link-secondary" href="../index.html">Back to home</a>
    </div>
    <p class="subhead" id="ctaHint" style="margin-top:18px;font-size:.9rem;"></p>
  </section>
</div>
<script>
(function () {
  var base = "https://deltaiq-signal-engine-production.up.railway.app/account/login";
  var sid = new URLSearchParams(location.search).get("session_id") || "";
  var a = document.getElementById("accountCta");
  var hint = document.getElementById("ctaHint");
  if (sid) {
    a.href = base + "?set_password=1&session_id=" + encodeURIComponent(sid);
  } else {
    hint.textContent = "If Create password asks for a session link, return here from Stripe Checkout (URL should include session_id), or contact support@getdeltaiq.com.";
  }
})();
</script>
</body>
</html>
