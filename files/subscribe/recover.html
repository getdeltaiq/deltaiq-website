<body>
<div class="chrome-bar">
  <div class="chrome-inner">
    <div class="chrome-dots"><span></span><span></span><span></span></div>
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">delta<span>iq</span></a></div>
    <nav class="top-nav">
      <a href="/#pricing">Subscribe</a>
      <a href="/account.html" class="nav-account">My Account</a>
    </nav>
  </div>
</div>
<div class="wrap">
  <section class="hero" style="border-bottom:none;">
    <p class="eyebrow">// TRIAL</p>
    <h1 class="headline">Finish your 14-day free trial</h1>
    <p class="subhead">You started checkout but didn’t finish. Resume below — card required, not charged for 14 days for new customers, then $69/mo. Cancel anytime in My Account.</p>
    <div class="cta-row">
      <div class="cta-primary-wrap">
        <button type="button" class="btn-primary" data-checkout-start id="recoverCta">Resume free trial</button>
        <p class="cta-hint" id="recoverHint">Opening secure checkout…</p>
      </div>
      <a class="link-secondary" href="/account.html">Already subscribed? My Account</a>
    </div>
  </section>
</div>
<script src="../js/site-config.js"></script>
<script src="../js/analytics.js"></script>
<script src="../js/checkout.js?v=20261004a"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var email = (params.get("email") || "").trim();
  var hint = document.getElementById("recoverHint");
  if (email) {
    try { sessionStorage.setItem("deltaiq_checkout_email", email); } catch (e) {}
    if (hint) hint.textContent = "Continue with " + email + " · card required, not charged during trial";
  } else if (hint) {
    hint.textContent = "14 days free for new customers · then $69/mo · cancel anytime";
  }
  if (typeof window.deltaiqTrack === "function") {
    window.deltaiqTrack("recover_checkout_view", { has_email: !!email });
  }
  // Auto-open consent modal so recovery is one click from email.
  setTimeout(function () {
    var btn = document.getElementById("recoverCta");
    if (btn) btn.click();
  }, 150);
})();
</script>
