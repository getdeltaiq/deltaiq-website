# Static marketing site — publish the files/ directory.
[build]
  publish = "files"
  command = "echo 'static site'"

# Prefer the clean homepage URL over /index.html (duplicate content).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
